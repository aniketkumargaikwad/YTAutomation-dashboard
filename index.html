<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Control Room</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14161a;--muted:#667085;--line:#e6e8ec;--accent:#e5484d;--accent2:#3e63dd;--good:#30a46c;--warn:#f5a524;--bad:#e5484d;--chip:#f1f3f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--ink:#eceef2;--muted:#9aa3b2;--line:#262a33;--chip:#20242c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'IBM Plex Sans',system-ui,sans-serif}
h1,h2,.kpi .v,.slot b{font-family:'Bricolage Grotesque','IBM Plex Sans',sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:18px 16px;max-width:1200px;margin:0 auto}
h1{font-size:20px;margin:0;letter-spacing:-.01em}h1 span{color:var(--accent)}
.sub{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{max-width:1200px;margin:0 auto;padding:0 16px 40px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.02em}.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v.sm{font-size:17px;line-height:1.3;padding-top:5px}.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media(max-width:860px){.grid2{grid-template-columns:1fr}}
h2{font-size:14px;margin:0 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}td.n{text-align:right;font-variant-numeric:tabular-nums}th.n{text-align:right}
.scroll{overflow-x:auto}
a{color:var(--accent2);text-decoration:none}a:hover{text-decoration:underline}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted);margin-right:4px;white-space:nowrap}
.slots{display:flex;gap:8px;flex-wrap:wrap}.slot{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;min-width:120px}
.slot b{display:block;font-size:15px}.slot.done{border-style:solid;border-color:var(--good)}
.run{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.ok{background:var(--good)}.warn{background:var(--warn)}.error{background:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--accent2)}.barrow{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.empty{color:var(--muted);padding:10px 0}
.title{max-width:440px}
canvas{max-height:240px}
</style>
</head>
<body>
<header>
  <div><h1>Shorts <span>Control Room</span></h1><div class="sub" id="updated">loading…</div></div>
  <div class="tabs" id="tabs"></div>
</header>
<main>
  <section class="kpis" id="kpis"></section>
  <section class="grid2">
    <div class="card"><h2>Views over time</h2><canvas id="chart"></canvas><div class="empty" id="chartEmpty" hidden>No YouTube numbers yet. They appear after the first Short is live and the channel ID is set.</div></div>
    <div class="card"><h2>Today's plan</h2><div class="sub" id="planSub"></div><div class="slots" id="slots" style="margin-top:10px"></div>
      <h2 style="margin-top:18px">What's working</h2><div id="learn"></div></div>
  </section>
  <section class="card"><h2>Published Shorts</h2><div class="scroll"><table id="pub"></table></div></section>
  <section class="grid2">
    <div class="card"><h2>Up next (queue)</h2><div class="scroll"><table id="queue"></table></div></div>
    <div class="card"><h2>Pipeline activity</h2><div id="runs"></div></div>
  </section>
</main>
<script>
const fmt=n=>n==null?'–':n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':n.toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=(iso,tz)=>iso?new Date(iso).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit',month:'short',day:'numeric'}):'–';
const ago=iso=>{if(!iso)return'never';const m=(Date.now()-new Date(iso))/6e4;return m<1?'just now':m<60?Math.round(m)+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'};
let DATA,CUR,chart;
function getTab(){try{return localStorage.getItem('tab')}catch(e){return null}}
function setTab(t){try{localStorage.setItem('tab',t)}catch(e){}}
async function load(){
  const r=await fetch('data.json?t='+Date.now());DATA=await r.json();
  const names=Object.keys(DATA.channels);CUR=names.includes(getTab())?getTab():names[0];
  document.getElementById('tabs').innerHTML=names.map(n=>`<button data-n="${n}" class="${n===CUR?'on':''}">${esc(DATA.channels[n].label)}${DATA.channels[n].enabled?'':' (paused)'}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{CUR=b.dataset.n;setTab(CUR);render()});
  render();
}
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.n===CUR));
  const c=DATA.channels[CUR],s=c.stats||{},t=c.totals;
  document.getElementById('updated').textContent=`Updated ${ago(DATA.generated_at)} · YouTube stats ${ago(DATA.stats_updated_at)}${s.source?' ('+s.source+')':''}`;
  const next=c.queue.find(q=>q.eta);
  const k=[['Views',fmt(s.views??t.views),'all Shorts'],['Likes',fmt(t.likes),'on our Shorts'],['Subscribers',fmt(s.subscribers),s.subscribers==null?'needs API key':''],
    ['Published',t.published,''],['Queued',t.queued,c.today?`${(t.queued/Math.max(1,c.today.count)).toFixed(1)} days of content`:''],['Next post',next?when(next.eta):'–',next?esc(next.title).slice(0,40):'',1]];
  document.getElementById('kpis').innerHTML=k.map(([l,v,d,sm])=>`<div class="card kpi"><div class="l">${l}</div><div class="v${sm?' sm':''}">${v}</div><div class="d">${d}</div></div>`).join('');
  // plan
  const tp=c.today;document.getElementById('planSub').textContent=tp?`${tp.count} Short(s) today · times in ${c.timezone}`:'Channel paused';
  const doneKeys=new Set(c.published.map(p=>p.slot));
  document.getElementById('slots').innerHTML=tp&&tp.slots.length?tp.slots.map(h=>{const key=`${tp.date}@${String(h).padStart(2,'0')}`;const d=doneKeys.has(key);
    return `<div class="slot ${d?'done':''}"><b>${h%12||12}:00 ${h<12?'AM':'PM'}</b><span class="sub">${d?'posted':'scheduled'}</span></div>`}).join(''):'<div class="empty">No slots today</div>';
  // learn
  const L=DATA.learned||{};let html='';
  for(const [key,label] of [['style','Style'],['streamer','Streamer'],['hour','Hour']]){const g=L[key]||{};const rows=Object.entries(g).sort((a,b)=>b[1].median_views-a[1].median_views).slice(0,4);
    if(!rows.length)continue;const max=Math.max(...rows.map(r=>r[1].median_views),1);
    html+=`<div class="sub" style="margin-top:6px">${label} (median views)</div>`+rows.map(([n,v])=>`<div class="barrow"><span>${esc(key==='hour'?n+':00':n)}</span><div class="bar" style="width:${Math.max(4,100*v.median_views/max)}%"></div><span class="sub">${fmt(v.median_views)} · n${v.n}</span></div>`).join('')}
  document.getElementById('learn').innerHTML=html||'<div class="empty">Learns after a few Shorts are 24 h old.</div>';
  // published table
  document.getElementById('pub').innerHTML=c.published.length?`<tr><th>Short</th><th>Posted</th><th class="n">Views</th><th class="n">Likes</th><th class="n">Comments</th><th>Style · streamer</th></tr>`+
    c.published.map(p=>`<tr><td class="title">${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.title)}</a>`:esc(p.title)}${p.url?'':'<div class="sub">waiting for YouTube</div>'}</td><td>${when(p.published_at)}</td><td class="n">${fmt(p.views)}</td><td class="n">${fmt(p.likes)}</td><td class="n">${fmt(p.comments)}</td><td><span class="chip">${esc(p.style)}</span><span class="chip">${esc(p.streamer)}</span></td></tr>`).join(''):'<tr><td class="empty">Nothing published yet.</td></tr>';
  // queue
  document.getElementById('queue').innerHTML=c.queue.length?`<tr><th>Clip</th><th>Goes live</th><th class="n">Score</th></tr>`+
    c.queue.map(q=>`<tr><td class="title">${esc(q.title)}<div><span class="chip">${esc(q.style)}</span><span class="chip">${esc(q.streamer)}</span>${q.seconds?`<span class="chip">${Math.round(q.seconds)}s</span>`:''}</div></td><td>${q.eta?when(q.eta):'<span class="sub">later</span>'}</td><td class="n">${q.score??''}</td></tr>`).join(''):'<tr><td class="empty">Queue is empty: the next cloud run will make more.</td></tr>';
  // runs
  document.getElementById('runs').innerHTML=(DATA.runs||[]).slice(0,15).map(r=>`<div class="run"><span class="dot ${r.status}"></span><div><b>${esc(r.job)}</b> <span class="sub">${ago(r.at)}</span><div class="sub">${esc(r.message)}</div></div></div>`).join('')||'<div class="empty">No runs yet.</div>';
  drawChart(c);
}
function drawChart(c){
  const pts={};for(const p of c.published)for(const [t,v] of p.history||[]){const d=t.slice(0,13);pts[d]=pts[d]||{};pts[d][p.title]=v}
  const keys=Object.keys(pts).sort();const empty=!keys.length;document.getElementById('chartEmpty').hidden=!empty;document.getElementById('chart').hidden=empty;
  if(chart)chart.destroy();if(empty)return;
  const last={};const series=keys.map(k=>{Object.assign(last,pts[k]);return Object.values(last).reduce((a,b)=>a+b,0)});
  const css=getComputedStyle(document.documentElement);
  chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:keys.map(k=>k.replace('T',' ')+'h'),datasets:[{data:series,borderColor:css.getPropertyValue('--accent').trim(),backgroundColor:'transparent',tension:.3,pointRadius:0,borderWidth:2}]},
    options:{plugins:{legend:{display:false}},scales:{x:{ticks:{maxTicksLimit:6,color:css.getPropertyValue('--muted').trim()},grid:{display:false}},y:{ticks:{color:css.getPropertyValue('--muted').trim()},grid:{color:css.getPropertyValue('--line').trim()}}}}});
}
load().catch(e=>{document.getElementById('updated').textContent='Could not load data.json: '+e});
setInterval(load,5*60*1000);
</script>
</body>
</html>
